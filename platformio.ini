[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters =
    colorize
    time

board_build.filesystem = littlefs

lib_ldf_mode = deep+
check_tool = cppcheck
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
